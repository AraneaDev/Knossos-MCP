name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Opens/updates the Release PR from Conventional Commits. On merge of that
      # PR, creates the vX.Y.Z tag + GitHub Release and sets release_created=true.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # tag/release are made with GITHUB_TOKEN, no separate tag-triggered
      # workflow would fire — so build/verify/publish live here instead.
      # Full history: the profile's `gate` lane measures the released tree
      # against the commit before it, and a shallow clone cannot reach one.
      #
      # Credentials are NOT persisted. actions/checkout writes GITHUB_TOKEN into
      # .git/config by default, and this job's token carries `contents: write`
      # and `pull-requests: write`. The quality container is handed this
      # checkout so the gate lane can read history, and a read-only mount stops
      # nothing here: reading the credential is the whole risk, and everything
      # the profile runs, tests and their dependencies included, could read it.
      # Nothing after this step uses git credentials -- release-please took its
      # own token above, and the image push authenticates to the registry
      # separately -- so persisting them buys nothing.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned quality image
        if: ${{ steps.release.outputs.release_created }}
        run: docker build --target quality -t knossos-mcp:quality .

      # The same versioned profile that gates every PR, re-run against the
      # released tree: lint, static analysis, tests, coverage floors, mutation
      # score, security audits, and supply-chain assurance.
      - name: Run full quality profile
        if: ${{ steps.release.outputs.release_created }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e KNOSSOS_GATE_REPO=/workspace \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace:ro" \
            knossos-mcp:quality full

      - name: Verify the released runtime image reports its version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          docker build --target runtime -t knossos-mcp:release .
          docker run --rm knossos-mcp:release version --json
          docker run --rm knossos-mcp:release doctor --json

      # Pre-release: no container registry yet. Intentionally dormant. To go
      # public: remove `if: false` and add registry auth (OIDC or a token).
      - name: Publish runtime image
        if: false
        run: |
          echo "docker push placeholder for ${{ steps.release.outputs.tag_name }}"
