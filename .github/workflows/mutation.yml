name: Mutation

# A full-src Infection run takes ~80 minutes, so it is not wired into the
# Quality workflow or any tools/quality profile. It runs on a weekly schedule so
# the mutation floor in infection.json5 is actually exercised against the full
# source tree (and can be ratcheted upward honestly against measured results),
# and can also be triggered from the Actions tab on demand.
on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC every Monday.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned quality image
        run: docker build --target quality -t knossos-mcp:quality .
      # memory_limit is raised from the image's stock 128M because that ceiling
      # belongs to the Infection master process, which holds the parsed source
      # and prints each mutant from it. The 2026-08-03 run died at ~3,600
      # mutants with "Allowed memory size of 134217728 bytes exhausted" inside
      # the pretty-printer — gradual growth across a full-src pass, not one
      # pathological file, so the limit is the thing that has to move. It stays
      # a real ceiling rather than -1 so a genuine runaway still fails loudly.
      # Only the master is affected; the PHPUnit children keep the image
      # default.
      - name: Run Infection over src
        run: |
          docker run --rm -e KNOSSOS_QUALITY_CONTAINER=1 --entrypoint sh knossos-mcp:quality \
            -c 'php -d pcov.enabled=1 -d memory_limit=2G vendor/bin/infection --no-interaction --no-progress --threads=4'
