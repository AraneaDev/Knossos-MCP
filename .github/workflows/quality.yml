name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Tagged by commit so a lane can only run the image built for the commit it is
# testing, and lowercased because a registry reference must be.
env:
  QUALITY_IMAGE: ghcr.io/araneadev/knossos:quality-${{ github.sha }}
  RUNTIME_IMAGE: ghcr.io/araneadev/knossos:runtime-${{ github.sha }}

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # One build populates the layer cache the lanes then hit. Measured on the run
  # this split replaced: 124s to build the image, 425s to run the gate inside
  # it. Building once and reusing the layers keeps the first number off every
  # lane, and running the lanes side by side turns the second into whichever
  # lane is slowest.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the run's images to this repository's registry
    # A pull request from a fork gets a read-only GITHUB_TOKEN, so a login and
    # a push to the registry fail there and turn the required check red for
    # every outside contributor. Such a run builds the same two images, hands
    # them to the lanes as a short-lived artifact, and never touches the
    # registry. Every step that differs between the two routes carries the
    # same expression: a push, or a pull request whose head lives in this
    # repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed to the registry rather than exported to the Actions cache.
      # Measured on the run before this change, every lane paid between 60 and
      # 138 seconds to `load` this image, because buildx has to rebuild it
      # from cached layers and import it into the daemon. In three of the five
      # lanes that cost more than the lane's own work: the rust lane spent
      # 119 seconds loading and 13 seconds working. A pull from a registry in
      # the same datacentre moves bytes instead of reconstructing an image.
      #
      # Tagged by commit, so a lane can only ever run the image built for the
      # commit it is testing.
      # Today's date, so the runtime stage's `apt-get upgrade` layer is rebuilt
      # once a day instead of being served from the cache indefinitely. See the
      # APT_REFRESH comment in the Dockerfile.
      - name: Date the package upgrade layer
        id: apt-refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build and push the pinned quality image
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: quality
          tags: ${{ env.QUALITY_IMAGE }}
          cache-from: type=gha,scope=quality-image
          cache-to: type=gha,mode=max,scope=quality-image
          build-args: APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # The release lane builds this target too, from inside the quality
      # container against the host daemon, where buildx's cache does not
      # reach. Publishing it here and pulling it there turns an uncached
      # build into a pull: tools/quality only builds it when it is absent.
      - name: Build and push the runtime image
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: ${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image
          build-args: APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # The fork route: the same builds, same tags and same cache scopes,
      # written to tarballs instead of the registry.
      - name: Build the quality image to a tarball
        if: ${{ !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: quality
          tags: ${{ env.QUALITY_IMAGE }}
          cache-from: type=gha,scope=quality-image
          cache-to: type=gha,mode=max,scope=quality-image
          build-args: APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          outputs: type=docker,dest=/tmp/quality.tar
      - name: Build the runtime image to a tarball
        if: ${{ !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: ${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image
          build-args: APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          outputs: type=docker,dest=/tmp/runtime.tar
      - name: Hand the images to the lanes
        if: ${{ !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: images
          path: |
            /tmp/quality.tar
            /tmp/runtime.tar
          retention-days: 1
          if-no-files-found: error

  lane:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing lane must not cancel the others: a maintainer fixing a red
      # gate wants every lane's verdict from one run, not the first one to go
      # red and four cancellations.
      fail-fast: false
      matrix:
        # `static` holds the linters and static analysis, `tests` the suites,
        # `rust` the cargo toolchain because it is slow and self-contained,
        # `release` the supply-chain and packaging checks, `coverage` the pcov
        # run and its budgets, `gate` Knossos's own architecture budgets
        # measured against Knossos. The split is by independence, not by
        # language: see tools/quality for why coverage cannot be split per
        # language, and what `gate` does and does not enforce.
        #
        # A release-please pull request runs `static` alone. Its diff is
        # version.txt, the manifest, a CHANGELOG entry and the version string
        # in Dockerfile and Application.php, so every other lane re-verifies
        # code byte-identical to the main it was cut from, which had just gone
        # green. `static` still covers what such a pull request can break: the
        # version strings agreeing across the four files, the changelog's
        # markdown, and the one edited PHP line. The full matrix runs again on
        # the push to main after it merges, so nothing reaches a tag unchecked.
        #
        # Matched on the prefix release-please owns, not an exact name: a
        # component-scoped repository calls the branch
        # release-please--branches--main--components--<name>, and an equality
        # test silently never fires there. A human pushing code to a branch of
        # that shape would skip the lanes, which is why the post-merge run on
        # main is the backstop rather than this being the only gate.
        lane:
          ${{ fromJSON(startsWith(github.head_ref, 'release-please--branches--') &&
          '["static"]' || '["static","tests","rust","release","coverage","gate"]') }}
    permissions:
      contents: read
      packages: read
    steps:
      # The `gate` lane measures this change against the commit it forked
      # from, so it needs history; every other lane only needs the tree. The
      # depths are strings on purpose: `matrix.lane == 'gate' && 0 || 1` would
      # always yield 1, because a numeric 0 is falsy and falls through the
      # `||`, and the lane would then run against a shallow clone that cannot
      # reach its own baseline.
      #
      # Credentials are NOT persisted, for the same reason: the gate lane is
      # handed this checkout on a mount, and a token in .git/config would be
      # readable by everything the lane runs. This job only ever reads history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ matrix.lane == 'gate' && '0' || '1' }}
          persist-credentials: false
      # Same-repo runs pull the commit's images from the registry; a fork's
      # run loads the tarballs the image job uploaded. Both routes end with
      # the same local names, so every later step is shared.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the pinned quality image
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          docker pull --quiet "$QUALITY_IMAGE"
          docker tag "$QUALITY_IMAGE" knossos:quality
      - name: Pull the runtime image
        if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.lane == 'release' }}
        run: |
          docker pull --quiet "$RUNTIME_IMAGE"
          docker tag "$RUNTIME_IMAGE" knossos:quality-runtime
      - name: Download the images built for this commit
        if: ${{ !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: ${{ runner.temp }}/images
      - name: Load the images built for this commit
        if: ${{ !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          docker load --quiet -i "$RUNNER_TEMP/images/quality.tar"
          docker load --quiet -i "$RUNNER_TEMP/images/runtime.tar"
          docker tag "$QUALITY_IMAGE" knossos:quality
          docker tag "$RUNTIME_IMAGE" knossos:quality-runtime
          rm -rf "$RUNNER_TEMP/images"
      # Trivy downloads its vulnerability database on first use, and the lane
      # container is thrown away after every run, so it downloaded the whole
      # thing again each time. Cached on the host and mounted in.
      #
      # The key carries the date so the database is refreshed daily rather
      # than pinned: a stale vulnerability database reports a clean image
      # because it has not heard of the vulnerability yet, which is the one
      # failure mode a security scan must not have.
      - name: Restore the trivy vulnerability database
        if: matrix.lane == 'release'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Reports are copied out of the container instead of bind-mounted back.
      # A runner whose workspace is itself a container mount cannot bind host
      # paths that only exist inside the job, and Docker would silently create
      # an empty directory on the host instead of failing.
      - name: Run the ${{ matrix.lane }} lane
        if: matrix.lane != 'gate'
        env:
          LANE: ${{ matrix.lane }}
          EXTERNAL_LINKS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -e KNOSSOS_EXTERNAL_LINKS="$EXTERNAL_LINKS" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy-cache" \
            knossos:quality full "$LANE"
      # The gate lane runs on its own because it is the one lane that needs the
      # repository's history: the image bakes this source without .git, so the
      # checkout is mounted and the baseline commit named explicitly.
      #
      # A pull request is measured against the commit it targets. A push is
      # measured against the tip it replaced, which is empty on the first push
      # to a branch and all-zeros on a force push; both cases hand the lane an
      # empty value, and it falls back to the merge base and then to HEAD^.
      - name: Work out the baseline commit
        if: matrix.lane == 'gate'
        id: gate-base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          case "$base" in
            '' | 0000000000000000000000000000000000000000) base='' ;;
          esac
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'baseline: %s\n' "${base:-<derived by the lane>}"
      - name: Run the gate lane
        if: matrix.lane == 'gate'
        env:
          GATE_BASE_REF: ${{ steps.gate-base.outputs.sha }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e KNOSSOS_GATE_REPO=/workspace \
            -e KNOSSOS_GATE_BASE_REF="$GATE_BASE_REF" \
            -v "$PWD:/workspace:ro" \
            knossos:quality full gate
      - name: Collect reports
        if: always() && matrix.lane == 'coverage'
        run: |
          docker cp knossos-quality:/opt/knossos/coverage ./coverage
          docker rm knossos-quality
      - name: Upload coverage and benchmark reports
        if: always() && matrix.lane == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: coverage/
          if-no-files-found: error

  # The name branch protection requires. Keeping it means the required check
  # survives the split: a lane that goes red fails this job, and a lane that is
  # skipped or cancelled fails it too, so a green `quality` still means every
  # lane ran and passed.
  quality:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publishes the coverage badge to the gh-pages branch
    steps:
      - name: Require every lane to have passed
        env:
          RESULT: ${{ needs.lane.result }}
        run: |
          result="$RESULT"
          printf 'lane matrix result: %s\n' "$result"
          [ "$result" = 'success' ] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.ref == 'refs/heads/main'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: quality-reports
          path: coverage/
      # Self-hosted coverage badge: the percentage is published as a shields endpoint on an
      # orphan `gh-pages` branch, force-pushed so it stays a single commit and never grows
      # history. Only on main, because a pull request must not be able to move the badge.
      # The script sums all three languages; PHP alone is the bulk of the code.
      - name: Setup Node LTS
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/badge
          node tools/coverage-badge.mjs > /tmp/badge/coverage.json
          cat /tmp/badge/coverage.json
          cd /tmp/badge
          git init -q
          git checkout -q -b gh-pages
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'chore: publish coverage badge'
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
