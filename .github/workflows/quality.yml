name: Quality

on:
  pull_request:
  push:
    branches: [main]
  # The dependency images are keyed by date as well as by their inputs, so the
  # first run of each UTC day rebuilds them to pick up Debian's fixes. This
  # run does that shortly after midnight, so the day's first push finds them
  # published. It runs the image job only.
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

# The route a run takes to its images. The registry route publishes and pulls
# the dependency images, so it needs a GITHUB_TOKEN that can write packages:
# pushes, scheduled runs, and pull requests from this repository. A fork's pull
# request and a Dependabot pull request get a read-only token, so they take the
# local route instead: a full build handed to the lanes as an artifact, with no
# login and no push. 'true' or 'false'; every step that differs between the
# routes tests it.
env:
  REGISTRY_ROUTE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests. A scheduled run has a group of
# its own, so it can never replace a pending push run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # The image's dependency stages (runtime_deps and quality_tools in the
  # Dockerfile) hold everything slow and large, and change only when their
  # inputs do. They are published to the registry under a key: a hash of those
  # inputs (tools/quality-deps-key) plus today's date, which is also the
  # APT_REFRESH build argument, so the key and the build agree on which day's
  # Debian fixes the image carries. When both images for the key already
  # exist, this job only checks that and ends; each lane then adds this
  # commit's source on top in a thin local build. Measured before this split,
  # the per-commit build-and-push took 247 s on every run, most of it pushing
  # and exporting to the Actions cache layers a source change had invalidated.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the dependency images to this repository's registry
    outputs:
      quality-deps: ${{ steps.key.outputs.quality }}
      runtime-deps: ${{ steps.key.outputs.runtime }}
    # On the local route (see REGISTRY_ROUTE) a login and a push to the
    # registry would fail and turn the required check red for every outside
    # contributor and every Dependabot update. Such a run builds the full
    # quality and runtime images, hands them to the lanes as a short-lived
    # artifact, and never touches the registry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Lowercased because a registry reference must be.
      - name: Key the dependency images
        id: key
        run: |
          date=$(date -u +%F)
          key="$(tools/quality-deps-key)-$date"
          {
            echo "date=$date"
            echo "quality=ghcr.io/araneadev/knossos:quality-deps-$key"
            echo "runtime=ghcr.io/araneadev/knossos:runtime-deps-$key"
          } >> "$GITHUB_OUTPUT"
          printf 'dependency key: %s\n' "$key"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.REGISTRY_ROUTE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Any failure to read a tag counts as missing: the cost of a wrong
      # "missing" is one rebuild, the cost of a wrong "present" is a red lane.
      - name: Check for the dependency images
        id: published
        if: ${{ env.REGISTRY_ROUTE == 'true' }}
        env:
          QUALITY_DEPS: ${{ steps.key.outputs.quality }}
          RUNTIME_DEPS: ${{ steps.key.outputs.runtime }}
        run: |
          if docker buildx imagetools inspect "$QUALITY_DEPS" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$RUNTIME_DEPS" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'both dependency images are published; nothing to build'
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'a dependency image is missing; building both'
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.published.outputs.build != 'false' }}
      # The Actions cache is written only here, on the rare run that builds the
      # dependency images, so a source-only push no longer pays to export every
      # layer of every stage to it. Two runs that find the same key missing
      # both build and push it; the last push wins, and the images are
      # equivalent because they come from the same inputs on the same day.
      - name: Build and push the runtime dependency image
        if: ${{ steps.published.outputs.build == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime_deps
          tags: ${{ steps.key.outputs.runtime }}
          cache-from: type=gha,scope=quality-deps
          cache-to: type=gha,mode=max,scope=quality-deps
          build-args: APT_REFRESH=${{ steps.key.outputs.date }}
          push: true
      - name: Build and push the quality dependency image
        if: ${{ steps.published.outputs.build == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: quality_tools
          tags: ${{ steps.key.outputs.quality }}
          cache-from: type=gha,scope=quality-deps
          cache-to: type=gha,mode=max,scope=quality-deps
          build-args: APT_REFRESH=${{ steps.key.outputs.date }}
          push: true
      # The local route: the full quality and runtime images, written to
      # tarballs instead of the registry. It reads the dependency layers the
      # registry route cached and writes nothing back.
      - name: Build the quality image to a tarball
        if: ${{ env.REGISTRY_ROUTE != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: quality
          tags: knossos:quality
          cache-from: type=gha,scope=quality-deps
          build-args: APT_REFRESH=${{ steps.key.outputs.date }}
          outputs: type=docker,dest=/tmp/quality.tar
      - name: Build the runtime image to a tarball
        if: ${{ env.REGISTRY_ROUTE != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: knossos:quality-runtime
          cache-from: type=gha,scope=quality-deps
          build-args: APT_REFRESH=${{ steps.key.outputs.date }}
          outputs: type=docker,dest=/tmp/runtime.tar
      - name: Hand the images to the lanes
        if: ${{ env.REGISTRY_ROUTE != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: images
          path: |
            /tmp/quality.tar
            /tmp/runtime.tar
          retention-days: 1
          if-no-files-found: error

  lane:
    needs: image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing lane must not cancel the others: a maintainer fixing a red
      # gate wants every lane's verdict from one run, not the first one to go
      # red and four cancellations.
      fail-fast: false
      matrix:
        # `static` holds the linters and static analysis, `tests` the suites,
        # `rust` the cargo toolchain because it is slow and self-contained,
        # `release` the supply-chain and packaging checks, `gate` Knossos's
        # own architecture budgets measured against Knossos. The split is by
        # independence, not by language: see tools/quality for why coverage
        # cannot be split per language, and what `gate` does and does not
        # enforce. Coverage is not a lane here: the coverage-shard and
        # coverage jobs below run it split over several runners.
        #
        # A release-please pull request runs `static` alone, and no coverage
        # jobs. Its diff is
        # version.txt, the manifest, a CHANGELOG entry and the version string
        # in Dockerfile and Application.php, so every other lane re-verifies
        # code byte-identical to the main it was cut from, which had just gone
        # green. `static` still covers what such a pull request can break: the
        # version strings agreeing across the four files, the changelog's
        # markdown, and the one edited PHP line. The full matrix runs again on
        # the push to main after it merges, so nothing reaches a tag unchecked.
        #
        # Matched on the prefix release-please owns, not an exact name: a
        # component-scoped repository calls the branch
        # release-please--branches--main--components--<name>, and an equality
        # test silently never fires there. A human pushing code to a branch of
        # that shape would skip the lanes, which is why the post-merge run on
        # main is the backstop rather than this being the only gate.
        lane:
          ${{ fromJSON(startsWith(github.head_ref, 'release-please--branches--') &&
          '["static"]' || '["static","tests","rust","release","gate"]') }}
    permissions:
      contents: read
      packages: read
    steps:
      # The `gate` lane measures this change against the commit it forked
      # from, so it needs history; every other lane only needs the tree. The
      # depths are strings on purpose: `matrix.lane == 'gate' && 0 || 1` would
      # always yield 1, because a numeric 0 is falsy and falls through the
      # `||`, and the lane would then run against a shallow clone that cannot
      # reach its own baseline.
      #
      # Credentials are NOT persisted, for the same reason: the gate lane is
      # handed this checkout on a mount, and a token in .git/config would be
      # readable by everything the lane runs. This job only ever reads history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ matrix.lane == 'gate' && '0' || '1' }}
          persist-credentials: false
      # On the registry route the lane adds this commit's source to the
      # dependency images the image job published; on the local route it loads
      # the tarballs the image job uploaded. Both routes end with the same local names, so every later
      # step is shared.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.REGISTRY_ROUTE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/quality-image
        with:
          quality-deps: ${{ needs.image.outputs.quality-deps }}
          runtime-deps: ${{ needs.image.outputs.runtime-deps }}
          runtime: ${{ matrix.lane == 'release' }}
          registry: ${{ env.REGISTRY_ROUTE }}
      # Trivy downloads its vulnerability database on first use, and the lane
      # container is thrown away after every run, so it downloaded the whole
      # thing again each time. Cached on the host and mounted in.
      #
      # The key carries the date so the database is refreshed daily rather
      # than pinned: a stale vulnerability database reports a clean image
      # because it has not heard of the vulnerability yet, which is the one
      # failure mode a security scan must not have.
      - name: Restore the trivy vulnerability database
        if: matrix.lane == 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Reports are copied out of the container instead of bind-mounted back.
      # A runner whose workspace is itself a container mount cannot bind host
      # paths that only exist inside the job, and Docker would silently create
      # an empty directory on the host instead of failing.
      - name: Run the ${{ matrix.lane }} lane
        if: matrix.lane != 'gate'
        env:
          LANE: ${{ matrix.lane }}
          EXTERNAL_LINKS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          # A pull request runs PHPUnit once, in the coverage shards. A push
          # to main runs it here as well, without pcov, as the backstop for a
          # defect that only shows when pcov is not loaded.
          PHPUNIT_IN_COVERAGE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -e KNOSSOS_EXTERNAL_LINKS="$EXTERNAL_LINKS" \
            -e KNOSSOS_PHPUNIT_IN_COVERAGE="$PHPUNIT_IN_COVERAGE" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy-cache" \
            knossos:quality full "$LANE"
      # The gate lane runs on its own because it is the one lane that needs the
      # repository's history: the image bakes this source without .git, so the
      # checkout is mounted and the baseline commit named explicitly.
      #
      # A pull request is measured against the commit it targets. A push is
      # measured against the tip it replaced, which is empty on the first push
      # to a branch and all-zeros on a force push; both cases hand the lane an
      # empty value, and it falls back to the merge base and then to HEAD^.
      - name: Work out the baseline commit
        if: matrix.lane == 'gate'
        id: gate-base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          case "$base" in
            '' | 0000000000000000000000000000000000000000) base='' ;;
          esac
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'baseline: %s\n' "${base:-<derived by the lane>}"
      - name: Run the gate lane
        if: matrix.lane == 'gate'
        env:
          GATE_BASE_REF: ${{ steps.gate-base.outputs.sha }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e KNOSSOS_GATE_REPO=/workspace \
            -e KNOSSOS_GATE_BASE_REF="$GATE_BASE_REF" \
            -v "$PWD:/workspace:ro" \
            knossos:quality full gate

  # The PHPUnit suite under pcov, split by test file over several runners
  # (tools/phpunit-shard). Measured as one job it was the longest on the
  # critical path, 430-760 s of PHPUnit alone. Each shard uploads its raw
  # per-process data and its JUnit log; nothing is reported or enforced here,
  # because a floor only means something over the whole suite. The shard
  # count is the matrix's length: tools/coverage reads it from
  # strategy.job-total, and the merge reads it from the shards' markers.
  coverage-shard:
    needs: image
    if: github.event_name != 'schedule' && !startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard's verdict from one run, as for the lanes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.REGISTRY_ROUTE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/quality-image
        with:
          quality-deps: ${{ needs.image.outputs.quality-deps }}
          runtime-deps: ${{ needs.image.outputs.runtime-deps }}
          registry: ${{ env.REGISTRY_ROUTE }}
      - name: Run shard ${{ matrix.shard }} of the coverage suite
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            --entrypoint /opt/knossos/tools/coverage knossos:quality run --shard="$SHARD/$SHARDS"
          docker cp knossos-quality:/opt/knossos/coverage "./shard-$SHARD"
          docker rm knossos-quality
      # coverage.py names its data files .coverage.<host>.<pid>.<random>, and
      # upload-artifact leaves dot files out unless told otherwise; without
      # them the Python figure would be measured on pytest alone.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Gathers the shards' data and enforces every coverage floor over it, with
  # the same commands an unsharded run uses. tools/coverage-merge.php refuses
  # unless every shard finished and every test file ran in exactly one shard,
  # so a shard that lost files cannot pass with a lower figure. It runs only
  # when every shard succeeded; if any did not, it is skipped, and the
  # quality job treats a skipped merge as a failure.
  coverage:
    needs: [image, coverage-shard]
    if: github.event_name != 'schedule' && !startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.REGISTRY_ROUTE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/quality-image
        with:
          quality-deps: ${{ needs.image.outputs.quality-deps }}
          runtime-deps: ${{ needs.image.outputs.runtime-deps }}
          registry: ${{ env.REGISTRY_ROUTE }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: raw/
          merge-multiple: false
      # Copied in rather than bind-mounted, like the reports coming out: a
      # runner whose workspace is itself a container mount cannot bind paths
      # that only exist inside the job.
      - name: Merge the shards and enforce the coverage floors
        run: |
          docker create --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            --entrypoint sh knossos:quality \
            -c 'tools/coverage merge /opt/knossos/coverage-raw && tools/coverage report'
          docker cp raw/. knossos-quality:/opt/knossos/coverage-raw
          docker start -a knossos-quality
      # Reports are copied out of the container instead of bind-mounted back.
      # A runner whose workspace is itself a container mount cannot bind host
      # paths that only exist inside the job, and Docker would silently create
      # an empty directory on the host instead of failing.
      - name: Collect reports
        if: always()
        run: |
          docker cp knossos-quality:/opt/knossos/coverage ./coverage
          docker rm knossos-quality
      - name: Upload coverage and benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: coverage/
          if-no-files-found: error

  # The name branch protection requires. Keeping it means the required check
  # survives the split: a lane, shard or merge that goes red fails this job,
  # and one that is skipped or cancelled when it should have run fails it too,
  # so a green `quality` still means everything ran and passed. The one
  # expected skip is a release-please pull request's coverage jobs.
  quality:
    needs: [lane, coverage-shard, coverage]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publishes the coverage badge to the gh-pages branch
    steps:
      - name: Require every lane, shard and the merge to have passed
        env:
          LANES: ${{ needs.lane.result }}
          SHARDS: ${{ needs.coverage-shard.result }}
          MERGE: ${{ needs.coverage.result }}
          RELEASE_PLEASE: ${{ startsWith(github.head_ref, 'release-please--branches--') }}
        run: |
          printf 'lanes: %s\ncoverage shards: %s\ncoverage merge: %s\nrelease-please branch: %s\n' \
            "$LANES" "$SHARDS" "$MERGE" "$RELEASE_PLEASE"
          if [ "$RELEASE_PLEASE" = 'true' ]; then
            expected='success skipped skipped'
          else
            expected='success success success'
          fi
          [ "$LANES $SHARDS $MERGE" = "$expected" ] || {
            echo "expected lanes, shards and merge to be: $expected" >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.ref == 'refs/heads/main'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: quality-reports
          path: coverage/
      # Self-hosted coverage badge: the percentage is published as a shields endpoint on an
      # orphan `gh-pages` branch, force-pushed so it stays a single commit and never grows
      # history. Only on main, because a pull request must not be able to move the badge.
      # The script sums all three languages; PHP alone is the bulk of the code.
      - name: Setup Node LTS
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/badge
          node tools/coverage-badge.mjs > /tmp/badge/coverage.json
          cat /tmp/badge/coverage.json
          cd /tmp/badge
          git init -q
          git checkout -q -b gh-pages
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'chore: publish coverage badge'
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
