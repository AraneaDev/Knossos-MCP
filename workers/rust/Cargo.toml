[package]
name = "knossos-rust-worker"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Knossos scanner worker for Rust projects"
license = "MIT"

[dependencies]
# `span-locations` is REQUIRED, not an optimisation. Without it,
# `Span::start()`/`end()` are gated behind `#[cfg(span_locations)]` in the
# pinned proc-macro2, so dropping the feature is a compile error here, not a
# silent runtime bug.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RustCrypto's SHA-256, the implementation the core compares a worker's
# `content_hash` against. Pinned to `0.10`: `0.11` requires a newer toolchain
# than this crate's `rust-version`.
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[build-dependencies]
# `build.rs` embeds the hash of this crate's source with the same SHA-256 the
# worker uses, so `doctor` can tell a binary built from older source.
sha2 = "0.10"

[profile.release]
opt-level = 2
strip = true
