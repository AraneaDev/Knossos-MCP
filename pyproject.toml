[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/Fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "C90", "PLR0912", "PLR0915"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately use bare asserts.
"workers/python/tests/**" = ["S101"]
# The worker imports its own package only after putting its directory on
# sys.path, which `python3 -I` leaves off.
"workers/python/bin/worker.py" = ["E402"]

[tool.ruff.lint.isort]
# Keeps a redundant `name as name` re-export inside one import statement
# instead of splitting it out, so worker.py imports its package once.
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["workers/python/bin/worker.py", "workers/python/bin/knossos_python"]
